<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 464" width="1280" height="464" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">campus-llm-wiki-ja の構成</title>
  <desc id="banner-desc">資料が 00 Inbox から raw、wiki、outputs へ流れ、wiki のページから raw の根拠をたどれて、lint がリンクと原文と根拠を点検することを示す図。</desc>
  <defs>
    <style>
      .sans { font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    </style>
    <marker id="banner-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="banner-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>
  <rect width="1280" height="464" fill="#f5f5f5"/>

  <text x="64" y="76" class="mono" font-size="40" font-weight="600" fill="#2d3142">campus-llm-wiki-ja</text>
  <text x="64" y="116" class="sans" font-size="20" fill="#4f5d75">大学の授業と就活のための、根拠をたどれる LLM Wiki</text>

  <!-- 流れ -->
  <g fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#banner-arrow)">
    <line x1="280" y1="264" x2="372" y2="264"/>
    <line x1="592" y1="264" x2="684" y2="264"/>
    <line x1="904" y1="264" x2="996" y2="264"/>
    <line x1="484" y1="372" x2="484" y2="324"/>
    <line x1="796" y1="372" x2="796" y2="324"/>
  </g>
  <!-- 根拠をたどる -->
  <path d="M796 208 V184 Q796 176 788 176 H492 Q484 176 484 184 V204" fill="none" stroke="#eb6c36" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#banner-arrow-accent)"/>
  <rect x="580" y="144" width="120" height="24" rx="2" fill="#f5f5f5"/>
  <text x="640" y="162" class="sans" font-size="16" font-weight="600" fill="#c9521f" text-anchor="middle">根拠をたどる</text>

  <!-- ノード -->
  <rect x="64" y="208" width="216" height="112" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1.2"/>
  <text x="172" y="256" class="mono" font-size="24" font-weight="600" fill="#2d3142" text-anchor="middle">00 Inbox</text>
  <text x="172" y="288" class="sans" font-size="16" fill="#4f5d75" text-anchor="middle">資料を入れる</text>

  <rect x="376" y="208" width="216" height="112" rx="6" fill="#ebebeb" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="484" y="256" class="mono" font-size="24" font-weight="600" fill="#2d3142" text-anchor="middle">raw</text>
  <text x="484" y="288" class="sans" font-size="16" fill="#4f5d75" text-anchor="middle">原文をそのまま保存</text>

  <rect x="688" y="208" width="216" height="112" rx="6" fill="#fcefe8" stroke="#eb6c36" stroke-width="1.6"/>
  <text x="796" y="256" class="mono" font-size="24" font-weight="600" fill="#2d3142" text-anchor="middle">wiki</text>
  <text x="796" y="288" class="sans" font-size="16" fill="#4f5d75" text-anchor="middle">根拠つきの知識</text>

  <rect x="1000" y="208" width="216" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="1108" y="256" class="mono" font-size="24" font-weight="600" fill="#2d3142" text-anchor="middle">outputs</text>
  <text x="1108" y="288" class="sans" font-size="16" fill="#4f5d75" text-anchor="middle">就活・学習に活かす</text>

  <!-- lint -->
  <rect x="376" y="372" width="528" height="48" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="640" y="402" text-anchor="middle" font-size="16" fill="#4f5d75"><tspan class="mono" font-weight="600" fill="#2d3142">lint</tspan><tspan class="sans" dx="12">リンク切れ・原文の改変・根拠のない数字を点検</tspan></text>
</svg>
